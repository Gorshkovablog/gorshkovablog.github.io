name: Publish Domokhozyayka

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the archives
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract the site
        run: |
          unzip -q domokhozyayka-site-1.zip -d _site
          unzip -q domokhozyayka-site-2.zip -d _site
          find _site -type f -name '*.html' -exec sed -i 's|https://skobeevdigital-cmd.github.io|https://gorshkovablog.github.io|g' {} +
          test -s _site/index.html
          test -s _site/home.js
          test -s _site/recipes/index.html
          test -s _site/robots.txt
      - name: Apply search metadata
        run: python3 search-metadata.py _site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
