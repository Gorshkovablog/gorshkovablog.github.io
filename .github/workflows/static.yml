name: Publish Domokhozyayka

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the archives
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract the site
        run: |
          unzip -q domokhozyayka-site-1.zip -d _site
          unzip -q domokhozyayka-site-2.zip -d _site
          find _site -type f -name '*.html' -exec sed -i 's|https://skobeevdigital-cmd.github.io|https://gorshkovablog.github.io|g' {} +
          test -s _site/index.html
          test -s _site/home.js
          test -s _site/recipes/index.html
          test -s _site/robots.txt
      - name: Apply search metadata
        run: python3 search-metadata.py _site
      - name: Add Yandex Webmaster verification
        run: |
          cat > _site/yandex_30b210ff2b20ea26.html <<'HTML'
          <html>
              <head>
                  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
              </head>
              <body>Verification: 30b210ff2b20ea26</body>
          </html>
          HTML
      - name: Install Yandex Metrika
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          counter = '''
          <!-- Yandex.Metrika counter -->
          <script type="text/javascript">
              (function(m,e,t,r,i,k,a){
                  m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
                  m[i].l=1*new Date();
                  for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
                  k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
              })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=114142362', 'ym');

              ym(114142362, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
          </script>
          <noscript><div><img src="https://mc.yandex.ru/watch/114142362" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
          <!-- /Yandex.Metrika counter -->
          '''
          site = Path('_site')
          for page in [site / '404.html', *sorted(site.rglob('index.html'))]:
              html = page.read_text(encoding='utf-8')
              if 'metrika/tag.js?id=114142362' in html:
                  continue
              updated, count = re.subn(r'<body\b[^>]*>', lambda match: match[0] + counter, html, count=1)
              if count != 1:
                  raise ValueError(f'Missing body element in {page}')
              page.write_text(updated, encoding='utf-8')
          PY
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
